<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flash Lesson</title>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
body{
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#f5f5f5;
}
</style>

</head>
<body>

<div id="flash-container"></div>

<script>
window.RufflePlayer = window.RufflePlayer || {};

const ruffle = window.RufflePlayer.newest();

const player = ruffle.createPlayer();

document.getElementById("flash-container")
.appendChild(player);

player.style.width = "535px";
player.style.height = "620px";

player.load("story.swf");
</script>

</body>
</html>
